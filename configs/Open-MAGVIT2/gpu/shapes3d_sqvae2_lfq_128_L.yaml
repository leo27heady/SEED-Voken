# SQ-VAE-2 with LFQ per layer (in/out projection when dim != log2(codebook_size))
seed_everything: true
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 2000
  check_val_every_n_epoch: 20
  num_sanity_val_steps: -1
  log_every_n_steps: 100
  default_root_dir: ../../checkpoints/vqgan/shapes3d_sqvae2_lfq
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "../../checkpoints/vqgan/shapes3d_sqvae2_lfq"
        save_top_k: -1
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: src.Open_MAGVIT2.callbacks.video_reconstruction_logger.VideoReconstructionLogger
      init_args:
        every_n_epochs: 20
        max_samples: 2
        log_wandb: true
        save_dir: reconstructions
        cell_size: 96
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: seed-voken-shapes3d
      name: sqvae2_lfq_128_L
      save_dir: ../../results/vqgan/

model:
  class_path: src.Open_MAGVIT2.models.video_hier_vqgan.VideoHierVQModel
  init_args:
    ddconfig:
      double_z: False
      z_channels: 64
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 4
    hierarchy:
      mode: sqvae2
      token_grid: native
      latent_key: t3_h16_w16
      blocks_sq: "t3_h16_w16_x1,t9_h64_w64_x1"
      tap_channels:
        t3_h16_w16: 64
        t9_h64_w64: 256
    quantizer:
      type: lfq
      size_dict: [512, 512]
      dim_dict: [64, 64]
      sample_minimization_weight: 1.0
      batch_maximization_weight: 1.0
      log_param_q_init: [4.09434, 4.09434]
      temperature:
        init: 1.0
        decay: 1.0e-5
        min: 0.1
    learning_rate: 1.0e-4
    training_objective: hq_elbo
    use_gan: false
    use_ema: true
    top_down_width: 64
    scheduler_type: "None"
    sche_type: cos
    wpe: 0.01
    wp: 2
    wp0: 0.0

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 2
    num_workers: 4
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: train
          sequence_length: 9
          dataset_size: 1000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: validation
          sequence_length: 9
          dataset_size: 100
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    test:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: test
          sequence_length: 9
          dataset_size: 100
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache

ckpt_path: null
