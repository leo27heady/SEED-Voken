seed_everything: true
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 2000
  check_val_every_n_epoch: 4
  num_sanity_val_steps: -1
  log_every_n_steps: 100
  default_root_dir: ../../checkpoints/vqgan/shapes3d_sqvae2_32_S_lite
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "../../checkpoints/vqgan/shapes3d_sqvae2_32_S_lite"
        monitor: val_ema/mse
        mode: min
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: src.Open_MAGVIT2.callbacks.video_reconstruction_logger.VideoReconstructionLogger
      init_args:
        every_n_epochs: 1
        max_samples: 2
        log_wandb: true
        save_dir: reconstructions
        cell_size: 96
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: seed-voken-shapes3d
      name: sqvae2_32_S_lite
      save_dir: ../../results/vqgan/

model:
  class_path: src.Open_MAGVIT2.models.video_hier_vqgan.VideoHierVQModel
  init_args:
    progressive_coding: false
    ddconfig:
      double_z: False
      z_channels: 16
      resolution: 32
      in_channels: 3
      out_ch: 3
      # Same 4-level pyramid as 64px v2 (32→16→8→4); half spatial scale → h16/h8/h4 ≡ h32/h16/h8 @64.
      ch: 32
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 1
      num_groups: 8
    hierarchy:
      mode: sqvae2
      token_grid: native
      tap_key_format: spatial
      sequence_length: 9
      latent_key: h4_w4
      blocks_sq: "h4_w4_x1,h8_w8_x1,h16_w16_x1"
      tap_channels:
        h4_w4: 16
        h8_w8: 64
        h16_w16: 64
    quantizer:
      type: sq
      prior: zero
      size_dict: [4096, 2048, 1024]
      dim_dict: [96, 96, 96]
      log_param_q_init: [4.09434, 4.09434, 4.09434]
      temperature:
        init: 1.0
        decay: 1.0e-5
        min: 0.3
    learning_rate: 1.0e-4
    training_objective: hq_elbo
    use_gan: false
    use_ema: true
    top_down_width: 16
    scheduler_type: "None"
    sche_type: cos
    wpe: 0.01
    wp: 2
    wp0: 0.0
    max_iter:
    wp_iter:
    resume_lr:

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 48
    num_workers: 8
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: train
          sequence_length: 9
          dataset_size: 10000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: validation
          sequence_length: 9
          dataset_size: 500
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    test:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: test
          sequence_length: 9
          dataset_size: 500
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache

ckpt_path: null
