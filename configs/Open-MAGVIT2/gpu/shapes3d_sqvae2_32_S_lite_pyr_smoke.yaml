# 2-epoch CPU smoke test for the Path A pyramid config (CI / dev sanity).
# python main.py fit --config configs/Open-MAGVIT2/gpu/shapes3d_sqvae2_32_S_lite_pyr_smoke.yaml
seed_everything: 1234
trainer:
  accelerator: cpu
  strategy: auto
  devices: 1
  precision: 32
  max_epochs: 2
  limit_train_batches: 4
  limit_val_batches: 2
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  default_root_dir: ../../checkpoints/vqgan/shapes3d_sqvae2_32_S_lite_pyr_smoke
  logger: false
  callbacks:
    - class_path: src.Open_MAGVIT2.callbacks.nan_guard.NanGuardCallback

model:
  class_path: src.Open_MAGVIT2.models.video_hier_vqgan.VideoHierVQModel
  init_args:
    progressive_coding: false
    ddconfig:
      double_z: False
      z_channels: 16
      resolution: 32
      in_channels: 3
      out_ch: 3
      ch: 32
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 1
      num_groups: 8
    dec_ddconfig:
      double_z: False
      z_channels: 16
      resolution: 32
      in_channels: 3
      out_ch: 3
      ch: 32
      ch_mult: [1, 2]
      num_res_blocks: 1
      num_groups: 8
    hierarchy:
      mode: sqvae2
      token_grid: pyramid
      tap_key_format: spatial
      sequence_length: 9
      latent_key: h4_w4
      blocks_sq: "h4_w4_x1,h8_w8_u2,h16_w16_u2"
      temporal_up: [2, 2]
      decoder_source: finest_state
      tap_channels:
        h4_w4: 16
        h8_w8: 64
        h16_w16: 64
    quantizer:
      type: sq
      prior: zero
      size_dict: [4096, 2048, 1024]
      dim_dict: [96, 96, 96]
      log_param_q_init: [4.09434, 4.09434, 4.09434]
      temperature:
        init: 1.0
        decay: 1.0e-5
        min: 0.3
    loss_cfg:
      kl_beta: 1.0
      kl_warmup_steps: 0
      grad_clip: 1.0
    learning_rate: 1.0e-4
    use_gan: false
    use_ema: true
    top_down_width: 16
    scheduler_type: "None"

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 2
    num_workers: 0
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: train
          sequence_length: 9
          dataset_size: 8
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache_smoke
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: validation
          sequence_length: 9
          dataset_size: 4
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache_smoke

ckpt_path: null
