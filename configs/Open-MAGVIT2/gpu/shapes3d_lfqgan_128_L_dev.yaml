seed_everything: true
trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 1
  fast_dev_run: 1
  num_sanity_val_steps: 0
  logger: false
  enable_checkpointing: false

model:
  class_path: src.Open_MAGVIT2.models.video_lfqgan.VQModel
  init_args:
    ddconfig:
      double_z: False
      z_channels: 18
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1,2,2,4]
      num_res_blocks: 4
    lossconfig:
      target: src.Open_MAGVIT2.modules.losses.video_vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3
        disc_num_layers: 3
        disc_start: 0
        disc_weight: 0.8
        gen_loss_weight: 0.3
        lecam_loss_weight: 0.05
        codebook_weight: 0.1
        commit_weight: 0.25
        codebook_enlarge_ratio: 0
        codebook_enlarge_steps: 2000
    n_embed: 262144
    embed_dim: 18
    learning_rate: 1e-4
    sample_minimization_weight: 1.0
    batch_maximization_weight: 1.0
    scheduler_type: "None"
    use_ema: False
    image_pretrain_path: null
    sche_type: cos
    wpe: 0.01
    wp: 2
    wp0: 0.0

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 1
    num_workers: 0
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: train
          sequence_length: 5
          dataset_size: 2
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: validation
          sequence_length: 5
          dataset_size: 1
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3
    test:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: test
          sequence_length: 5
          dataset_size: 1
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3

ckpt_path: null
