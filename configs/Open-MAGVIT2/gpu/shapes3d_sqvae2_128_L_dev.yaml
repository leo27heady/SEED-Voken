seed_everything: true
trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 1
  fast_dev_run: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  default_root_dir: ../../results/vqgan/shapes3d_sqvae2_dev
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: ../../results/vqgan/
      name: shapes3d_sqvae2_dev
  callbacks:
    - class_path: src.Open_MAGVIT2.callbacks.video_reconstruction_logger.VideoReconstructionLogger
      init_args:
        every_n_epochs: 1
        max_samples: 1
        log_wandb: false
        save_dir: reconstructions
        cell_size: 64

model:
  class_path: src.Open_MAGVIT2.models.video_hier_vqgan.VideoHierVQModel
  init_args:
    ddconfig:
      double_z: False
      z_channels: 64
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 4
    hierarchy:
      mode: sqvae2
      blocks_sq: "t2_h16_w16_x1,t5_h64_w64_x1"
      tap_channels:
        t2_h16_w16: 64
        t5_h64_w64: 256
    quantizer:
      type: sq
      size_dict: [512, 512]
      dim_dict: [64, 64]
      log_param_q_init: [4.09434, 4.09434]
      temperature:
        init: 1.0
        decay: 1.0e-5
        min: 0.1
    learning_rate: 1.0e-4
    training_objective: hq_elbo
    use_gan: false
    use_ema: false
    top_down_width: 64
    scheduler_type: "None"
    sche_type: cos
    wpe: 0.01
    wp: 2
    wp0: 0.0

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 1
    num_workers: 0
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: train
          sequence_length: 5
          dataset_size: 2
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: validation
          sequence_length: 5
          dataset_size: 1
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3
    test:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 128
          mode: validation
          sequence_length: 5
          dataset_size: 1
          cache: false
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 3

ckpt_path: null
