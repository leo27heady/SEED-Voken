# Predictor on the FSQ rightsized tokenizer (run dr8vrkt8, gate-passing after the
# 2026-06-15 quantizer-aware recalibration). Clone of the SQ pyramid predict config
# pointed at the FSQ tokenizer. Set vae_ckpt to the gated FSQ checkpoint.
#
# FSQ vocab is small (coarse K=512, mid K=1024, fine K=256) and FSQ has NO learned
# codebook to copy, so `predictor.codebook_dim` widens the predictor's own learned
# token embedding beyond the FSQ value-dim (4). t_context/t_total = 5/9 (T=9 lite).
seed_everything: 1234
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 500
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 2
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  default_root_dir: ../../checkpoints/predictor/shapes3d_fsq_32_S_lite_pyr_rightsized_predict
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "../../checkpoints/predictor/fsq_32_S_lite_pyr_rightsized_predict"
        monitor: val/loss_ce_ar
        mode: min
        save_top_k: 3
        save_last: true
        filename: "epoch={epoch:03d}-step={step}-val_ce={val/loss_ce_ar:.4f}"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: src.Open_MAGVIT2.callbacks.predictor_horizon_logger.PredictorHorizonLogger
      init_args:
        every_n_epochs: 1
        max_samples: 4
        log_wandb: true
        save_dir: predictions
        cell_size: 96
    - class_path: src.Open_MAGVIT2.callbacks.nan_guard.NanGuardCallback
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: seed-voken-shapes3d
      name: fsq_32_S_lite_pyr_rightsized_predict
      save_dir: ../../results/predictor/

model:
  class_path: src.Open_MAGVIT2.models.video_hier_predictor.VideoHierPredictorModel
  init_args:
    vae_config: configs/Open-MAGVIT2/gpu/shapes3d_fsq_32_S_lite_pyr_rightsized.yaml
    vae_ckpt: "../../checkpoints/vqgan/shapes3d_fsq_32_S_lite_pyr_rightsized/epoch=27-step=87500.ckpt"   # <-- gated FSQ ckpt (update if a better one is selected)
    freeze_encoder: true
    t_context: 5
    t_total: 9
    parent_conditioning: dual_stream
    shift_reentry:
      mode: streams_only
    predictor:
      dim: [256, 128, 64]
      # FSQ tokens are mixed-radix composite indices; predict each channel separately
      # (correct FSQ head + modest win). NOTE: this alone does NOT de-blob — coarse/mid
      # tokens are weakly predictable; see PROJECT_MEMORY §0.2 for the real levers.
      output_mode: factorized_fsq
      codebook_dim: [32, 32, 32]    # FSQ value-dim is 4; widen the learned embedding
      n_layers: [6, 4, 2]
      n_heads: [8, 8, 4]
      temporal_windows: [-1, 3, 2]  # fine sees the previous frame
      cross_spatial_window: 1       # 3x3 parent neighborhood
      attention:
        coarse: {type: full}
        mid: {type: factorized, t_window: 3}
        fine: {type: factorized, t_window: 2, spatial_window: 4}
    loss:
      lambda_ce: 1.0
      log_pred_mse: true
      pred_mse_every_n_steps: 50
      shift_ce_weights: uniform
    inference:
      mode: autoregressive
      commit: argmax
      parallel_mode: context
    learning_rate: 1.0e-4

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 32
    num_workers: 8
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: train
          sequence_length: 9
          dataset_size: 50000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: validation
          sequence_length: 9
          dataset_size: 1000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache

ckpt_path: null
