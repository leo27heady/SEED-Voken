seed_everything: true
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 500
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 2
  log_every_n_steps: 50
  default_root_dir: ../../checkpoints/predictor/shapes3d_sqvae2_64_S_v4_predict
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "../../checkpoints/predictor/sqvae2_64_S_v4_predict"
        monitor: val/loss_total_ar
        mode: min
        save_top_k: 3
        save_last: true
        filename: "epoch={epoch:03d}-step={step}-val_total={val/loss_total_ar:.4f}"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: src.Open_MAGVIT2.callbacks.predictor_horizon_logger.PredictorHorizonLogger
      init_args:
        every_n_epochs: 1
        max_samples: 4
        log_wandb: true
        save_dir: predictions
        cell_size: 96
    - class_path: src.Open_MAGVIT2.callbacks.nan_guard.NanGuardCallback
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: seed-voken-shapes3d
      name: sqvae2_64_S_v4_predict
      save_dir: ../../results/predictor/

model:
  class_path: src.Open_MAGVIT2.models.video_hier_predictor.VideoHierPredictorModel
  init_args:
    vae_config: configs/Open-MAGVIT2/gpu/shapes3d_sqvae2_64_S_v4.yaml
    vae_ckpt: null
    freeze_encoder: true
    t_context: 9
    t_total: 17
    parent_conditioning: dual_stream
    shift_reentry:
      mode: streams_only
    predictor:
      dim: [384, 256, 192, 128]
      n_layers: [8, 6, 4, 2]
      n_heads: [8, 8, 8, 4]
      temporal_windows: [-1, 3, 3, 1]
      attention:
        per_stage:
          - {type: full}
          - {type: full}
          - {type: factorized, t_window: 3, spatial_window: 8}
          - {type: factorized, t_window: 1, spatial_window: 8}
    loss:
      lambda_ce: 1.0
      lambda_pred_mse: 0.5
      shift_ce_weights: uniform
    inference:
      mode: autoregressive
      commit: argmax
    learning_rate: 1.0e-4

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 2
    num_workers: 4
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 64
          mode: train
          sequence_length: 17
          dataset_size: 1000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 64
          mode: validation
          sequence_length: 17
          dataset_size: 100
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache

ckpt_path: null
