# Next version — FSQ + progressive coding + finest-state pyramid + causal temporal align.
# FSQ (straight-through hard rounding) => train == eval quantization, so NO soft/hard
# gap (vs SQ's ~800x); progressive_coding fixes layer starvation. Match-K levels
# (4096/2048/1024) for a clean SQ<->FSQ ablation vs Run 2c. Run alongside the
# _rightsized config in the SAME GPU batch (low-d recon is the empirical risk, not the gap).
# Gate: python scripts/token_quality_report.py --config <this> --ckpt <best>
seed_everything: 1234
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 2000
  check_val_every_n_epoch: 4
  num_sanity_val_steps: -1
  log_every_n_steps: 100
  default_root_dir: ../../checkpoints/vqgan/shapes3d_fsq_32_S_lite_pyr
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "../../checkpoints/vqgan/shapes3d_fsq_32_S_lite_pyr"
        monitor: val_ema/mse
        mode: min
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_ema/mse
        mode: min
        patience: 10
        min_delta: 0.0
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: src.Open_MAGVIT2.callbacks.video_reconstruction_logger.VideoReconstructionLogger
      init_args:
        every_n_epochs: 1
        max_samples: 7
        log_wandb: true
        save_dir: reconstructions
        cell_size: 96
    - class_path: src.Open_MAGVIT2.callbacks.nan_guard.NanGuardCallback
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: seed-voken-shapes3d
      name: fsq_32_S_lite_pyr_matchk
      save_dir: ../../results/vqgan/

model:
  class_path: src.Open_MAGVIT2.models.video_hier_vqgan.VideoHierVQModel
  init_args:
    progressive_coding: true   # required: fixes coarse/mid starvation
    ddconfig:
      double_z: False
      z_channels: 16
      resolution: 32
      in_channels: 3
      out_ch: 3
      ch: 32
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 1
      num_groups: 8
    # decoder for the finest 9x16x16 z_state: one spatial doubling, T preserved.
    dec_ddconfig:
      double_z: False
      z_channels: 16
      resolution: 32
      in_channels: 3
      out_ch: 3
      ch: 64
      ch_mult: [1, 2]
      num_res_blocks: 2
      num_groups: 8
    hierarchy:
      mode: sqvae2
      token_grid: pyramid
      tap_key_format: spatial
      sequence_length: 9
      latent_key: h4_w4
      blocks_sq: "h4_w4_x1,h8_w8_u2,h16_w16_u2"
      temporal_up: [2, 2]          # T chain 3 -> 5 -> 9 (validated against taps)
      decoder_source: finest_state
      temporal_align_mode: causal  # fixes the t=1 progressive-L1 artifact (S1)
      tap_channels:
        h4_w4: 16
        h8_w8: 64
        h16_w16: 64
    quantizer:
      type: fsq
      # match-K levels: prod = 4096 / 2048 / 1024 (== Run 2c SQ codebook sizes).
      # FSQ derives dim_dict from levels; no temperature/prior/log_param_q/temporal_kl.
      levels: [[8, 8, 8, 8], [8, 8, 8, 4], [8, 8, 4, 4]]
    loss_cfg:
      kl_beta: 1.0          # irrelevant under FSQ (aux == 0); kept for schema parity
      grad_clip: 1.0
    learning_rate: 1.0e-4
    numerical_debug: false
    training_objective: hq_elbo
    use_gan: false
    use_ema: true
    top_down_width: 16
    scheduler_type: "None"
    sche_type: cos
    wpe: 0.01
    wp: 2
    wp0: 0.0
    max_iter:
    wp_iter:
    resume_lr:

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 16
    num_workers: 8
    train:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: train
          sequence_length: 9
          dataset_size: 50000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    validation:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: validation
          sequence_length: 9
          dataset_size: 1000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache
    test:
      target: src.Open_MAGVIT2.data.shape_video.ShapeVideoDataset
      params:
        config:
          size: 32
          mode: test
          sequence_length: 9
          dataset_size: 1000
          cache: true
          shape_scene_type: DIM_3
          shape_min_cubes: 2
          shape_max_cubes: 6
          shape_angle_min: 15
          shape_angle_max: 45
          shape_temporal_patterns: []
          shape_cache_dir: ../../data/shape_cache

ckpt_path: null
